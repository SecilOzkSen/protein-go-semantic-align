p3a_semexp_reranker:
  train_dump: /workspace/candidate_dumps/P3a_SemExp_train_top1000
  val_dump: /workspace/candidate_dumps/P3a_SemExp_val_top1000
  test_dump: null
  out_dir: /workspace/reranker_outputs/P3a_SemExp_top1000_semexp_interaction_mlp

  go_basic_json: /workspace/data/go_vocab.json

  topk: 1000
  model_kind: semexp_interaction_mlp
  hidden_dim: 512
  dropout: 0.10

  batch_size: 8
  num_workers: 0
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 10
  patience: 2
  grad_clip: 1.0
  pos_weight_max: 50.0

  # For SemExp we keep pairwise mild; previous P3a pairwise runs hurt AUPR when too strong.
  lambda_pair: 0.05
  hard_neg_k: 32

  n_thresholds: 501
  monitor: fmax
  device: cuda:0
