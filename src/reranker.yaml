model:
  model_kind: p3a_hiercross
  text_model_name: microsoft/BiomedNLP-PubMedBERT-base-uncased-abstract-fulltext
  protein_dim: 1280
  reranker_hidden_dim: 512
  reranker_dropout: 0.1
  freeze_text_encoder: true
  use_protein_ln: true
  use_go_ln: true

  # HierCross-specific
  cross_dim: 256
  cross_heads: 4
  cross_dropout: 0.1
  candidate_chunk_size: 16
  use_retriever_features: true
  use_cls_residual: true

  # Kept for old mean-pool reranker compatibility; ignored by p3a_hiercross.
  use_go_token_align_pooler: false
  go_align_attn_dim: 256
  go_align_dropout: 0.1
  use_go_residual: true

data:
  protein_max_len: 1024
  overlap: 256
  fs_target_ratio: 0.3

training:
  retriever_ckpt: /workspace/protein-go-align-outputs-P3a-P2cwarm-segGO-segProjOnly/checkpoint_step83945.pt
  device: cuda
  fp16: true
  # First sanity run: topk=200. If stable, move to 300/500.
  topk: 500
  batch_size: 2
  epochs: 10
  lr: 2e-5 #5e-5 #1.0e-4
  weight_decay: 0.01
  log_every: 100
  eval_every: 500
  save_metric: "fmax_full"
  out_dir: /workspace/protein-go-align/outputs/reranker/p3a_hiercross_np_p3asemexp200_esmknn300_top500 #/workspace/protein-go-align/outputs/reranker/p3a_hiercross_semexp_top500_lr5e5_drop015 #/workspace/protein-go-align/outputs/reranker/p3a_hiercross_direct_top1000
  eval_every_steps: 5000
  save_mid_checkpoints: true
  mid_checkpoint_metric: "fmax_full"

  resume: /workspace/protein-go-align/outputs/reranker/p3a_hiercross_semexp_top500_resume_lr3e5_scoredrop010/ckpt_best_fmax_full_step167890_epoch4.pt #/workspace/protein-go-align/outputs/reranker/p3a_hiercross_direct_top1000/ckpt_best_fmax_full_step67156_epoch1.pt
  resume_optimizer: false
  reset_optimizer_lr: true
  resume_lr: 2e-5
  resume_start_next_epoch: true

  # Strict direct retrieval first. Do not inject labels unless the run cannot learn.
  inject_true_positives: 0

  # BCE class imbalance compensation.
  pos_weight: 30.0

  # DAG consistency, small weight.
  use_dag_loss: true
  lambda_dag: 0.02
  dag_margin: 0.0
  grad_clip_norm: 1.0

  score_feature_dropout: 0.05
  rank_feature_dropout: 0.00

  use_candidate_dump: true
  train_candidate_dump: /workspace/candidate_dumps/P3aSemExp200_ESMknn300_union_train_top500 #/workspace/candidate_dumps/P3a_SemExp_train_top1000 #/workspace/candidate_dumps/P3a_train_top1000
  val_candidate_dump: /workspace/candidate_dumps/P3aSemExp200_ESMknn300_union_val_top500 #/workspace/candidate_dumps/P3a_SemExp_val_top1000 #/workspace/candidate_dumps/P3a_val_top1000

stores:
  train_ids_path: /workspace/data/splits/train_ids.txt
  pid2pos_path: /workspace/data/pid_to_positives_canonical.json
  val_ids_path: /workspace/data/splits/val_ids.txt
  embed_dir_res: /workspace/protein/residues/embeddings_1b_npy
  seq_len_lookup_dir: /workspace/data/seq_len_lookup.pkl
  go_text_folder: /workspace/data
  dag_parents_path: /workspace/data/go_parents.json
  go_cache_path: /workspace/data/go_embeddings/raw/go_text_embeddings_canonical.npy
  go_basic_json: /workspace/data/go_vocab.json
  zero_shot_path: /workspace/data/eval/buckets/count_based/go_eval_ids_zeroshot.pkl
  few_shot_path: /workspace/data/eval/buckets/count_based/go_eval_ids_rare_lt20.pkl
  seq_len_lookup: /workspace/data/seq_len_lookup.pkl
  go_path_seen: /workspace/data/eval/go_eval_ids_seen.pkl
  go_path_observed: /workspace/data/eval/go_eval_ids_observed.pkl
