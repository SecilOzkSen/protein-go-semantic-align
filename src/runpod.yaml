data:
  overlap: 256
  max_len: 1024
  no_cache_shards: false

  # DAG & expansion
  use_dag_in_ds: false
  min_pos_for_expand: 3
  max_ancestor_add: 4
  max_hops: 3
  ancestor_gamma: 0.7

  # Few/Zero-shot
  fs_target_ratio: 0.3

general: #Ablation Purposes
  phase: -2
  ablation_id: "A1" #A0 sanity check
  use_queue_miner: True #CHECKED
  use_go_memory_bank: False #CHECKED
  use_attention_pooling: False #CHECKED
  use_lora: True #CHECKED
  use_attribution_loss: False #CHECKED
  return_alpha: False
  phase_based: False #CHECKED
  pooling_strategy: "mean" #  "mean", "go_token_align_pooler" #CHECKED
  is_phasing: false # go token based phases are closed

caches:
  go_cache: null
  faiss_index: null
  go_cache_template: /workspace/cache/go_cache_phase{phase}.pt
  faiss_template: /workspace/cache/faiss_phase{phase}.index

training:
  epochs: 15
  batch_size: 4
  eval_batch_size: 4

  num_workers: 0
  val_num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2

  fp16: true
  cpu: false
  seed: 42

  output_dir: /workspace/protein-go-align/outputs/run-0
  save_every: 10000
  keep_last_n: 3
 # resume: null #/workspace/checkpoints/checkpoint_step56000.pt
  eval_only: false
  log_every: 500
  log_level: INFO
  monitor_metric: "align_MRR"   # "total" da olabilir
  monitor_mode: "max"           # "min" (ör. total loss) için değiştir
  early_stop_patience: 8        # 0 veya negatif => kapalı
  cand_chunk_k: 4 #8
  pos_chunk_t: 128
  k_hard_queue: 128  #32 #128 #16
  queue_K: 16384  #8192 #2048 #8192
  max_refresh_go: 2000 #7500 # max go queue refresh per epoch - bc we do lora training!
  eval_go_bs: 256 # eval go batch size for go embedding extraction
  go_text_store_max_len: 512 # batch size for storing go text embeddings
  is_logit_scale_constant: false #false = trainable logit scale
  go_token_dropout: false
  go_pooling: "none" # cls, mean, masked_mean -> NO NEED
  eval_space: "observed" #seen -> # observed: all go must be included to make evaluation reliable.
  # eval space: observed = observed go ids. train+val+test seen once.

optim:
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0

model:
  align_dim: 768
  temperature: 0.07
  attn_heads: 2
  attn_dropout: 0.1
  entropy_reg: 0.01
  win_size: 1024
  win_stride: 256

loss:
  lambda_con: 1.0
  lambda_dag: 0.0
  lambda_attr: 0.0
  lambda_entropy_alpha: 0.0
  dag_margin: 0.05
  dag_scale: 10.0
  lambda_vtrue: 0.0
  tau_distill: 1.0
  lambda_bce: 0.1

curriculum:
  epochs: 4
  warmup_frac: 0.1
  mode: cosine
  hard_frac: [0.2, 0.5]
  shortlist_M: [128, 64]
  k_hard: [4, 1]
  hier_up: [1, 0]
  hier_dn: [0, 0]
  random_k: [4, 0]
  inbatch_easy: [1.0, 0.0]
  neg_k: 8
  curriculum_mode: cosine

schedule:
  phase_breaks: [5, 9, 12]
  stageA_mix: [1.0, 0.0, 0.0]
  stageB_mix: [0.7, 0.3, 0.0]
  stageC_mix: [0.4, 0.4, 0.2]
  stageD_mix: [0.4, 0.4, 0.2]
  lambda_attr_start: 6
  lambda_attr_max: 0.2

wandb:
  enabled: true
  project: protein-go-align
  entity: null
  wandb_run_name: "protein-go-semantic-align-ablation0"
  mode: online

stores:
  train_ids_path: /workspace/data/splits/train_ids.txt
  val_ids_path: /workspace/data/splits/val_ids.txt

  go_basic_json: /workspace/data/go_vocab.json

  pid2pos_path: /workspace/data/pid_to_positives_canonical.json #pid_to_positives_canonical

  zero_shot_path: /workspace/data/eval/buckets/count_based/go_eval_ids_zeroshot.pkl
  few_shot_path: /workspace/data/eval/buckets/count_based/go_eval_ids_rare_lt20.pkl

  go_path_seen: /workspace/data/eval/go_eval_ids_seen.pkl # training seen
  go_path_observed: /workspace/data/eval/go_eval_ids_observed.pkl # train+val+test seen at once.

  embed_dir_res: /workspace/protein/residues/embeddings_1b_npy
  go_text_folder: /workspace/data
  go_cache_path: /workspace/data/go_embeddings/raw/go_text_embeddings_canonical.npy

  output_dir: /workspace/protein-go-align-outputs
  logs: /workspace/protein-go-align-logs

