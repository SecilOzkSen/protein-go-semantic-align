data:
  overlap: 256
  max_len: 1024
  # DAG & expansion
  use_dag_in_ds: true
  # Few/Zero-shot
  fs_target_ratio: 0.3

general: #Ablation Purposes
  phase: -2
  ablation_id: "B1_segment_aware_go" #A0 sanity check
  use_queue_miner: True #CHECKED
  go_pooling_strategy: "segment_aware" #CHECKED -> Go attention strategy "attn" or "mean" or "segment_aware"
  go_encoder_inner_pooling: "mean" #inside biomedbertencoder pooling
  use_lora: True #CHECKED
  use_attribution_loss: False #CHECKED
  return_alpha: False
  return_slot_attn: True
  protein_pooling_strategy: "mean_attn_gate" #  Protein pooling strategy "attn" or "mean" or "go_align" or "slots" or "mean_attn_gate"
  protein_n_slots: 0
  go_pool_type: "mean" # mean #pooled
  go_encoder_output_mode: "segment_pooled" # "pooled" | "tokens" | "both" | "segment_pooled" # inside go_encoder_output_mode pooling

training:
  epochs: 15
  batch_size: 4
  eval_batch_size: 4
  num_workers: 0
  val_num_workers: 0
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2
  fp16: true
  cpu: false
  seed: 42
  output_dir: /workspace/protein-go-align-outputs-B1v1
  save_every: 10000
  keep_last_n: 3
  resume: null #/workspace/protein-go-align-outputs-A2/checkpoint_step83945.pt
  eval_only: false
  log_every: 500
  log_level: INFO
  monitor_metric: "align_nDCG@10"   # "total" da olabilir
  monitor_mode: "max"           # "min" (ör. total loss) için değiştir
  early_stop_patience: 8        # 0 veya negatif => kapalı
  cand_chunk_k: 4 #8
  pos_chunk_t: 128
  max_refresh_go: 0 #27156 #2000 #7500 # max go queue refresh per epoch - bc we do lora training!
  eval_go_bs: 256 # eval go batch size for go embedding extraction
  go_text_store_max_len: 128 # TODO: 512 batch size for storing go text embeddings
  go_segment_max_len: 64
  is_logit_scale_constant: true #false = trainable logit scale
  go_token_dropout: false
  go_pooling: "none" # cls, mean, masked_mean -> NO NEED
  eval_space: "observed" #seen -> # observed: all go must be included to make evaluation reliable.
  # eval space: observed = observed go ids. train+val+test seen once.
  max_inbatch: 160
  eval_cand_chunk_k: 64

queue: # queue params
  queue_K: 16384  #8192 #2048 #8192
  queue_start_step: 2000
  queue_hard_frac_start: 0.0
  queue_hard_frac_end: 0.5
  queue_hard_frac_warmup_steps: 6000
  queue_weight_start: 0.2
  queue_weight_end: 1.0
  queue_weight_warmup_steps: 6000
  k_hard_queue_start: 4
  k_hard_queue_end: 24
  k_hard_queue_warmup_steps: 6000

optim:
  lr: 0.0001
  weight_decay: 0.01
  grad_clip: 1.0

model:
  align_dim: 768
  temperature: 0.07
  attn_heads: 2
  attn_dropout: 0.1
  entropy_reg: 0.01
  win_size: 1024
  win_stride: 256

loss:
  lambda_con: 1.0
  lambda_dag: 0.0
  lambda_attr: 0.0
  lambda_entropy_alpha: 0.0
  dag_margin: 0.05
  dag_scale: 10.0
  lambda_vtrue: 0.0
  tau_distill: 1.0
  lambda_bce: 0.0

curriculum:
  epochs: 4
  warmup_frac: 0.1
  mode: cosine
  hard_frac: [0.2, 0.5]
  shortlist_M: [128, 64]
  k_hard: [4, 1]
  hier_up: [1, 0]
  hier_dn: [0, 0]
  random_k: [4, 0]
  inbatch_easy: [1.0, 0.0]
  neg_k: 8
  curriculum_mode: cosine

schedule:
  phase_breaks: [5, 9, 12]
  stageA_mix: [1.0, 0.0, 0.0]
  stageB_mix: [0.7, 0.3, 0.0]
  stageC_mix: [0.4, 0.4, 0.2]
  stageD_mix: [0.4, 0.4, 0.2]
  lambda_attr_start: 6
  lambda_attr_max: 0.2

wandb:
  enabled: true
  project: protein-go-align
  entity: null
  wandb_run_name: "protein-go-semantic-align-ablation-b1v1-segment-aware"
  mode: online

stores:
  train_ids_path: /workspace/data/splits/train_ids.txt
  val_ids_path: /workspace/data/splits/val_ids.txt

  go_basic_json: /workspace/data/go_vocab.json

  pid2pos_path: /workspace/data/pid_to_positives_canonical.json #pid_to_positives_canonical

  zero_shot_path: /workspace/data/eval/buckets/count_based/go_eval_ids_zeroshot.pkl
  few_shot_path: /workspace/data/eval/buckets/count_based/go_eval_ids_rare_lt20.pkl

  go_path_seen: /workspace/data/eval/go_eval_ids_seen.pkl # training seen
  go_path_observed: /workspace/data/eval/go_eval_ids_observed.pkl # train+val+test seen at once.

  embed_dir_res: /workspace/protein/residues/embeddings_1b_npy
  go_text_folder: /workspace/data
  go_cache_path: /workspace/data/go_embeddings/raw/go_text_embeddings_canonical.npy

  seq_len_lookup: /workspace/data/seq_len_lookup.pkl

  logs: /workspace/protein-go-align-logs-a3

