data:
  overlap: 256
  max_len: 1024
  no_cache_shards: false

  # DAG & expansion
  use_dag_in_ds: true
  min_pos_for_expand: 3
  max_ancestor_add: 4
  max_hops: 3
  ancestor_gamma: 0.7

  # Few/Zero-shot
  fs_target_ratio: 0.3

general: #Ablation Purposes
  ablation_id: "A1-1" #A0 sanity check
  use_queue_miner: False #CHECKED
  use_go_memory_bank: False #CHECKED
  use_attention_pooling: False #CHECKED
  use_lora: True #CHECKED
  use_attribution_loss: False #CHECKED
  return_alpha: False
  phase_based: True #CHECKED
  pooling_strategy: "mean"

caches:
  go_cache: null
  faiss_index: null
  go_cache_template: /workspace/cache/go_cache_phase{phase}.pt
  faiss_template: /workspace/cache/faiss_phase{phase}.index

training:
  epochs: 15
  batch_size: 4
  eval_batch_size: 4

  num_workers: 0
  val_num_workers: 1
  pin_memory: true
  persistent_workers: false
  prefetch_factor: 2

  fp16: true
  cpu: false
  seed: 42

  output_dir: /workspace/protein-go-align/outputs/run
  save_every: 2000
  keep_last_n: 3
 # resume: null #/workspace/checkpoints/checkpoint_step56000.pt
  eval_only: false
  log_every: 500
  log_level: INFO
  monitor_metric: "align_nDCG@10"   # "total" da olabilir
  monitor_mode: "max"           # "min" (ör. total loss) için değiştir
  early_stop_patience: 10        # 0 veya negatif => kapalı
  cand_chunk_k: 8
  pos_chunk_t: 128
  k_hard_queue: 0 #32 #128
  queue_K: 0 #2048 #8192
  max_refresh_go: 7500 # max go queue refresh per epoch - bc we do lora training!
  eval_go_bs: 128 # eval go batch size for go embedding extraction
  go_text_store_max_len: 512 # batch size for storing go text embeddings
  is_logit_scale_constant: true #false = trainable logit scale
  go_token_dropout: true
  go_pooling: "masked_mean" # cls, mean, masked_mean

optim:
  lr: 0.0003
  weight_decay: 0.01
  grad_clip: 1.0

model:
  align_dim: 768
  temperature: 0.07
  attn_heads: 2
  attn_dropout: 0.1
  entropy_reg: 0.01
  win_size: 1024
  win_stride: 256

loss:
  lambda_con: 1.0
  lambda_dag: 0.0
  lambda_attr: 0.0
  lambda_entropy_alpha: 0.0
  dag_margin: 0.05
  dag_scale: 10.0
  lambda_vtrue: 0.0
  tau_distill: 1.0

curriculum:
  epochs: 4
  warmup_frac: 0.1
  mode: cosine
  hard_frac: [0.2, 0.7]
  shortlist_M: [128, 64]
  k_hard: [4, 1]
  hier_up: [1, 0]
  hier_dn: [0, 0]
  random_k: [4, 0]
  inbatch_easy: [1.0, 0.0]
  neg_k: 8
  curriculum_mode: cosine

schedule:
  phase_breaks: [5, 12, 25]
  stageA_mix: [1.0, 0.0, 0.0]
  stageB_mix: [0.7, 0.3, 0.0]
  stageC_mix: [0.4, 0.4, 0.2]
  stageD_mix: [0.4, 0.4, 0.2]
  lambda_attr_start: 6
  lambda_attr_max: 0.2

wandb:
  enabled: true
  project: protein-go-align
  entity: null
  wandb_run_name: "protein-go-semantic-align-ablation1"
  mode: online

stores:
  train_ids_path: /workspace/data/training_ready/proteins/protein_train_ids.txt
  pid2pos_path: /workspace/data/training_ready/proteins/pid_to_positives.json #pid_to_positives_canonical
  val_ids_path: /workspace/data/training_ready/proteins/protein_val_ids.txt

  embed_dir: /workspace/esm_output #ESM3b
  embed_dir_res: /workspace/protein/residues
  embed_dir_fused: /workspace/protein/fused
  hub_local_dir: /workspace/.cache/huggingface/hub

  seq_len_lookup_dir: /workspace/data/training_ready/proteins/seq_len_lookup.pkl
  protein_manifest_file: /workspace/data/training_ready/manifest_cache/esm_manifest.pkl

  output_dir: /workspace/protein-go-align-outputs
  logs: /workspace/protein-go-align-logs

  go_text_folder: /workspace/data/processed/go_terms/go_phases   #canonical #ablation 1