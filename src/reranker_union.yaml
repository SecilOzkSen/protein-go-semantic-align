reranker:
  train_dump: /workspace/candidate_dumps/P3a_ESMknn_sourceaware_union_train_top1000
  val_dump: /workspace/candidate_dumps/P3a_ESMknn_sourceaware_union_val_top1000
  test_dump: null
  out_dir: /workspace/reranker_outputs/P3a_ESMknn_sourceaware_union_top1000_interaction_mlp

  topk: 1000
  model_kind: source_aware_interaction_mlp
  hidden_dim: 512
  dropout: 0.10

  batch_size: 4
  num_workers: 0
  lr: 0.0001
  weight_decay: 0.0001
  epochs: 10
  patience: 2
  grad_clip: 1.0
  pos_weight_max: 50.0
  monitor: fmax
  device: cuda:0
  n_thresholds: 501
